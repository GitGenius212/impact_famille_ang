<form class="m-4 p-4 border rounded shadow-sm bg-light">
    <!-- Sélection du type de produit -->
    <div class="mb-4">
      <label for="productType" class="form-label fw-bold">Type du produit</label>
      <div class="row">
        <div class="col-12 col-md-6">
          <select 
            class="form-select" 
            id="productType" 
            aria-label="Sélectionnez le type du produit">
            <option selected disabled>Quel est le type du produit</option>
            <option value="1">Laitier</option>
            <option value="2">Protéine</option>
            <option value="3">Fruit</option>
            <option value="4">Légume</option>
            <option value="5">Grain entier</option>
          </select>
        </div>
      </div>
    </div>
  
    <!-- Bouton Envoyer -->
    <div class="text-end">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-send-fill me-1"></i> Envoyer
      </button>
    </div>
  </form>
