<form class="m-4 p-4 border rounded shadow-sm bg-light">
    <!-- Nom du produit -->
    <div class="mb-4">
      <label for="inputNom" class="form-label fw-bold">Nom du produit</label>
      <div class="row">
        <div class="col-12 col-md-6">
          <input 
            type="text" 
            class="form-control" 
            id="inputNom" 
            placeholder="Entrez le nom du produit">
        </div>
      </div>
    </div>
  
    <!-- Type du produit -->
    <div class="mb-4">
      <label class="form-label fw-bold">Type du produit</label>
      <div class="row">
        <div class="col-12 col-md-6">
          <select class="form-select">
            <option selected disabled>Quel est le type du produit</option>
            <option value="1">Laitier</option>
            <option value="2">Protéine</option>
            <option value="3">Fruit</option>
            <option value="4">Légume</option>
            <option value="5">Grain entier</option>
          </select>
        </div>
      </div>
    </div>
  
    <!-- Quantité -->
    <div class="mb-4">
      <label class="form-label fw-bold">Quantité</label>
      <div class="row align-items-center">
        <div class="col-12 col-md-6">
          <input 
            type="range" 
            name="quantite" 
            class="form-range" 
            min="0" 
            max="500" 
            step="1" 
            value="10" 
            id="rangeQuantite" 
            oninput="document.getElementById('rangeValue').textContent = this.value">
        </div>
        <div class="col-auto">
          <span id="rangeValue" class="badge bg-primary">10</span>
        </div>
      </div>
    </div>
  
    <!-- Photo -->
    <div class="mb-4">
      <label class="form-label fw-bold">Photo</label>
      <div class="form-floating">
        <input 
          type="text" 
          class="form-control" 
          id="inputPhoto" 
          placeholder="Entrez le lien de l'image">
        <label for="inputPhoto">Lien de l'image</label>
      </div>
      <small id="photoHelp" class="form-text text-muted">Exemple : https://lien_image</small>
    </div>
  
    <!-- Boîte -->
    <div class="mb-4">
      <label class="form-label fw-bold">Choisir une boîte</label>
      <div class="dropdown">
        <button 
          class="btn btn-light border form-select text-start" 
          type="button" 
          id="dropdownMenuButton1" 
          data-bs-toggle="dropdown" 
          aria-expanded="false">
          Sélectionnez une boîte
        </button>
        <ul class="dropdown-menu w-100" aria-labelledby="dropdownMenuButton1">
          <li>
            <a class="dropdown-item d-flex justify-content-between">
              <span>Laitier</span>
              <span class="badge bg-primary">5</span>
            </a>
          </li>
          <li>
            <a class="dropdown-item d-flex justify-content-between">
              <span>Protéine</span>
              <span class="badge bg-primary">2</span>
            </a>
          </li>
          <li>
            <a class="dropdown-item d-flex justify-content-between">
              <span>Fruit</span>
              <span class="badge bg-primary">1</span>
            </a>
          </li>
          <li>
            <a class="dropdown-item d-flex justify-content-between">
              <span>Légume</span>
              <span class="badge bg-primary">4</span>
            </a>
          </li>
          <li>
            <a class="dropdown-item d-flex justify-content-between">
              <span>Grain entier</span>
              <span class="badge bg-primary">10</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  
    <!-- Description -->
    <div class="mb-4">
      <label for="floatingTextareaDescription" class="form-label fw-bold">Description</label>
      <div class="form-floating">
        <textarea 
          class="form-control" 
          placeholder="Laissez une description ici" 
          id="floatingTextareaDescription" 
          style="height: 100px"></textarea>
        <label for="floatingTextareaDescription">Description</label>
      </div>
    </div>
  
    <!-- Bouton d'envoi -->
    <div class="text-end">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-send me-1"></i> Envoyer
      </button>
    </div>
  </form>
