<section class="vh-100" style="background-color: #f8f9fa !important">
    <div class="container py-5 h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col col-xl-10">
          <div class="card" style="border-radius: 1rem;">
            <div class="row g-0">
              <div class="col-md-12 col-lg-7 d-none d-md-block">
                <img src="../../../assets/images/emplacement.png"
                  alt="login form" class="img-fluid h-100" style="border-radius: 1rem 0 0 1rem;" />
              </div>
              <div class="col-md-12 col-lg-5 d-flex align-items-center">
                <div class="card-body p-4 p-lg-5 text-black">
                  <!-- {{loginForm.value | json}} -->
                  <form [formGroup]="loginForm" (ngSubmit)="handleLogin()">
  
                    <div class="d-flex align-items-center mb-3 pb-1">
                      <img class="me-2" width="50" height="50" src="https://th.bing.com/th/id/OIP.h0rGeknviQjZeAtcZLUTkAHaHa?rs=1&pid=ImgDetMain" alt="logo" />
                      <span class="h1 fw-bold mb-0">{{appStateService.title}}</span>
                    </div>
  
                    <h5 class="fw-normal mb-3 pb-3" style="letter-spacing: 1px;">Connectez-vous à votre compte</h5>
  
                    <div class="form-outline mb-4">
                      <p class="text-danger" *ngIf="errorMessage">{{errorMessage}}</p>
                      <input type="email" id="form2Example17" class="form-control form-control-lg" formControlName="username"/>
                      <label class="form-label" for="form2Example17">L'adresse email</label>
                    </div>
  
                    <div class="form-outline mb-4">
                      
                      <input type="password" id="form2Example27" formControlName="password" class="form-control form-control-lg" />
                      <label class="form-label" for="form2Example27">mot de passe</label>
                    </div>
  
                    <div class="pt-1 mb-4">
                      <button class="btn btn-dark btn-lg btn-block" type="submit">Se connecter</button>
                    </div>
  
                    <a class="small text-muted" href="#!">Mot de passe oublié?</a>
                    <p class="mb-5 pb-lg-2" style="color: #393f81;">Vous n'avez aucun compte? <a href="#!"
                        style="color: #393f81;">Inscrivez-vous ici</a></p>
                    <a href="#!" class="small text-muted">Termes d'utilisations.</a>
                    <a href="#!" class="small text-muted">Politique de confidentialité</a>
                  </form>
  
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
