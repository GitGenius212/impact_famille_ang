<div class="container my-4">
  <!-- Barre de recherche -->
  <div class="d-flex mt-2 ms-1 row g-3 align-items-center">
    <div class="col-12 col-sm-6 col-md-4 col-lg-3">
      <input
        class="form-control border-primary shadow-sm"
        type="search"
        placeholder="Recherche"
        aria-label="Search"
        [(ngModel)]="appState.userState.keyword"
      />
    </div>
    <div class="col">
      <button class="btn btn-primary shadow-sm" type="button" (click)="handleSearch()">
        Rechercher
      </button>
    </div>
  </div>

  <!-- Table -->
  <table class="table table-hover table-striped shadow-sm mt-4">
    <thead class="table-primary">
      <tr>
        <th scope="col">#</th>
        <th scope="col">Nom</th>
        <th scope="col">Prénom</th>
        <th scope="col">Situation Familiale</th>
        <th scope="col">Téléphone</th>
        <th scope="col">Région</th>
        <th scope="col" *ngIf="(appState.authState.roles.includes('DIRECTEUR') || appState.authState.roles.includes('BENEVOLE'))">
          Modifier
        </th>
        <th scope="col" *ngIf="(appState.authState.roles.includes('DIRECTEUR') || appState.authState.roles.includes('BENEVOLE'))">
          Supprimer
        </th>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let user of appState.userState.users"
        [class.table-info]="user.types.includes('Directeur')"
        [class.table-success]="user.types.includes('Client')"
        [class.table-warning]="user.types.includes('Bénévole') && !user.types.includes('Directeur')"
      >
        <th scope="row">{{ user.id }}</th>
        <td>
          {{ user.nom }}
          <span class="fst-italic d-block text-muted">{{ user.types }}</span>
        </td>
        <td>{{ user.prenom }}</td>
        <td>{{ user.situation_familiale }}</td>
        <td>{{ user.telephone }}</td>
        <td>{{ user.region }}</td>
        <td>
          <button
            class="btn btn-outline-primary"
            *ngIf="(appState.authState.roles.includes('DIRECTEUR') || appState.authState.roles.includes('BENEVOLE'))"
            (click)="handleEditUser(user)"
          >
            <i class="bi bi-pen"></i>
          </button>
        </td>
        <td>
          <button
            class="btn btn-outline-danger"
            *ngIf="(appState.authState.roles.includes('DIRECTEUR') || appState.authState.roles.includes('BENEVOLE'))"
            (click)="open(content, user)"
          >
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
  <app-modal></app-modal>
  <!-- Pagination -->
  <nav aria-label="Page navigation" class="d-flex justify-content-center mt-4">
    <ul class="pagination shadow-sm">
      <li class="page-item">
        <button class="page-link" (click)="handleGoToPreviousPage()" [disabled]="appState.userState.currentPage == 1">
          Précédent
        </button>
      </li>
      <li
        class="page-item"
        *ngFor="let page of [].constructor(appState.userState.totalPages); let i = index"
      >
        <button class="page-link" (click)="handleGoToPage(i + 1)" [class.active]="appState.userState.currentPage == (i + 1)">
          {{ i + 1 }}
        </button>
      </li>
      <li class="page-item">
        <button class="page-link" (click)="handleGoToNextPage()" [disabled]="appState.userState.currentPage == appState.userState.totalPages">
          Suivant
        </button>
      </li>
    </ul>
  </nav>

  <!-- Modal -->
  <ng-template #content let-modal>
    <div class="modal-header">
      <h4 class="modal-title">Confirmation de suppression</h4>
      <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
    </div>
    <div class="modal-body d-flex align-items-center">
      <i class="bi bi-x-circle text-danger me-3" style="font-size: 30px;"></i>
      <p class="fs-5 mb-0">Êtes-vous sûr ?</p>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="modal.dismiss('Close click')">Fermer</button>
      <button
        type="button"
        class="btn btn-danger"
        (click)="modal.close('Delete click')"
      >
        Supprimer
      </button>
    </div>
  </ng-template>
</div>
